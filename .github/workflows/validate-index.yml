name: Utyansky Index CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-index:
    name: Verify Coordinate Matrix & Collision Defense
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Utyansky Index Cross-Validator
        run: node examples/validate-index.js
